<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Now | Cross Border Visa Services</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .apply-page {
            background: #f5f6f8;
            padding: 50px 20px;
        }

        .apply-container {
            max-width: 1250px;
            margin: auto;
        }

        .application-box {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .form-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
            color: #111;
        }

        .form-heading p {
            color: #777;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group.two {
            grid-column: span 2;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #222;
        }

        .required {
            color: #d00000;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #c4162a;
        }

        .radio-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding-top: 8px;
        }

        .radio-box label {
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .radio-box input {
            width: auto;
        }

        .upload-box {
            border: 1px dashed #ccc;
            padding: 15px;
            border-radius: 6px;
            background: #fafafa;
        }

        .upload-box input {
            border: none;
            padding: 0;
        }

        .upload-note {
            font-size: 12px;
            color: #777;
            margin-top: 7px;
        }

        .submit-btn {
            grid-column: 1 / -1;
            width: 100%;
            background: #c4162a;
            color: white;
            border: none;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #a90f20;
        }

        .apply-title-bar {
            background: #111;
            color: white;
            padding: 35px 20px;
        }

        .apply-title-bar .apply-container h2 {
            font-size: 32px;
            margin: 0 0 8px;
        }

        .breadcrumb {
            color: #ddd;
            font-size: 14px;
        }

        @media (max-width: 900px) {

            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-group.two {
                grid-column: span 2;
            }

        }

        @media (max-width: 600px) {

            .apply-page {
                padding: 25px 12px;
            }

            .application-box {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.two,
            .form-group.full {
                grid-column: auto;
            }

            .form-heading h1 {
                font-size: 25px;
            }

            .apply-title-bar .apply-container h2 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


<!-- APPLY PAGE TITLE -->

<section class="apply-title-bar">

    <div class="apply-container">

        <h2>APPLY NOW</h2>

        <div class="breadcrumb">
            Home → Apply Now
        </div>

    </div>

</section>



<!-- APPLICATION FORM -->

<section class="apply-page">

    <div class="apply-container">

        <div class="application-box">


            <div class="form-heading">

                <h1>📄 VISA APPLICATION FORM</h1>

                <p>
                    Please fill in all the required details accurately.
                </p>

            </div>



            <form>


                <div class="form-grid">


                    <!-- COUNTRY -->

                    <div class="form-group">

                        <label>
                            Choose Country <span class="required">*</span>
                        </label>

                        <select required>

                            <option value="">
                                Select
                            </option>

                            <option>
                                Canada
                            </option>

                            <option>
                                United Kingdom
                            </option>

                            <option>
                                Australia
                            </option>

                            <option>
                                USA
                            </option>

                            <option>
                                Germany
                            </option>

                            <option>
                                France
                            </option>

                            <option>
                                Italy
                            </option>

                            <option>
                                Spain
                            </option>

                        </select>

                    </div>



                    <!-- LETTER TYPE -->

                    <div class="form-group">

                        <label>
                            Letter Type <span class="required">*</span>
                        </label>

                        <div class="radio-box">

                            <label>
                                <input type="radio" name="letter">
                                Visit Letter
                            </label>

                            <label>
                                <input type="radio" name="letter">
                                Family Letter
                            </label>

                            <label>
                                <input type="radio" name="letter">
                                Business Letter
                            </label>

                            <label>
                                <input type="radio" name="letter">
                                Mediation Letter
                            </label>

                        </div>

                    </div>



                    <!-- TRAVELERS -->

                    <div class="form-group">

                        <label>
                            Number of Travelers <span class="required">*</span>
                        </label>

                        <select required>

                            <option>
                                Select
                            </option>

                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option>5+</option>

                        </select>

                    </div>



                    <!-- EMBASSY -->

                    <div class="form-group two">

                        <label>
                            Embassy, where you will apply the visa
                        </label>

                        <input
                            type="text"
                            placeholder="Embassy name"
                        >

                    </div>



                    <!-- START DATE -->

                    <div class="form-group two">

                        <label>
                            Travel Start Date <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            required
                        >

                    </div>



                    <!-- FINISH DATE -->

                    <div class="form-group">

                        <label>
                            Travel Finish Date <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            required
                        >

                    </div>



                    <!-- TITLE -->

                    <div class="form-group">

                        <label>
                            Your Title <span class="required">*</span>
                        </label>

                        <div class="radio-box">

                            <label>
                                <input type="radio" name="title">
                                Mr.
                            </label>

                            <label>
                                <input type="radio" name="title">
                                Mrs.
                            </label>

                            <label>
                                <input type="radio" name="title">
                                Miss.
                            </label>

                        </div>

                    </div>



                    <!-- FULL NAME -->

                    <div class="form-group">

                        <label>
                            Full Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter full name"
                            required
                        >

                    </div>



                    <!-- DOB -->

                    <div class="form-group">

                        <label>
                            Date of Birth <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            required
                        >

                    </div>



                    <!-- PASSPORT NUMBER -->

                    <div class="form-group">

                        <label>
                            Passport Number <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Enter passport number"
                            required
                        >

                    </div>



                    <!-- ISSUING COUNTRY -->

                    <div class="form-group">

                        <label>
                            Issuing Country <span class="required">*</span>
                        </label>

                        <select required>

                            <option>
                                Select Country
                            </option>

                            <option>
                                Pakistan
                            </option>

                            <option>
                                India
                            </option>

                            <option>
                                Bangladesh
                            </option>

                            <option>
                                UAE
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- EXPIRY -->

                    <div class="form-group">

                        <label>
                            Date of Expire <span class="required">*</span>
                        </label>

                        <input
                            type="date"
                            required
                        >

                    </div>



                    <!-- PHONE -->

                    <div class="form-group two">

                        <label>
                            Phone <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>



                    <!-- EMAIL -->

                    <div class="form-group">

                        <label>
                            Email Address <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            placeholder="Enter email address"
                            required
                        >

                    </div>



                    <!-- ADDRESS -->

                    <div class="form-group full">

                        <label>
                            Home Address
                        </label>

                        <input
                            type="text"
                            placeholder="Enter home address"
                        >

                    </div>



                    <!-- PROFESSION -->

                    <div class="form-group">

                        <label>
                            Your Profession
                        </label>

                        <div class="radio-box">

                            <label>
                                <input
                                    type="radio"
                                    name="profession"
                                >
                                Job
                            </label>

                            <label>
                                <input
                                    type="radio"
                                    name="profession"
                                >
                                Business
                            </label>

                        </div>

                    </div>



                    <!-- DESIGNATION -->

                    <div class="form-group">

                        <label>
                            Your Designation
                        </label>

                        <input
                            type="text"
                            placeholder="Enter designation"
                        >

                    </div>



                    <!-- INCOME -->

                    <div class="form-group">

                        <label>
                            Annual Income in Euro
                        </label>

                        <input
                            type="number"
                            placeholder="Enter annual income"
                        >

                    </div>



                    <!-- EMPLOYER -->

                    <div class="form-group two">

                        <label>
                            Employer Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter employer name"
                        >

                    </div>



                    <!-- EMPLOYER ADDRESS -->

                    <div class="form-group">

                        <label>
                            Employer Address
                        </label>

                        <input
                            type="text"
                            placeholder="Enter employer address"
                        >

                    </div>



                    <!-- PASSPORT UPLOAD -->

                    <div class="form-group">

                        <label>
                            Passport (main applicant)
                            <span class="required">*</span>
                        </label>

                        <div class="upload-box">

                            <input
                                type="file"
                                accept=".jpg,.jpeg,.png,.pdf"
                                required
                            >

                            <div class="upload-note">
                                JPG, PNG or PDF - Max 5MB
                            </div>

                        </div>

                    </div>



                    <!-- WIFE PASSPORT -->

                    <div class="form-group">

                        <label>
                            Wife Passport
                            (if applying with her)
                        </label>

                        <div class="upload-box">

                            <input
                                type="file"
                                accept=".jpg,.jpeg,.png,.pdf"
                            >

                            <div class="upload-note">
                                JPG, PNG or PDF - Max 5MB
                            </div>

                        </div>

                    </div>



                    <!-- FAMILY PASSPORT -->

                    <div class="form-group">

                        <label>
                            Other Passports in one PDF
                            (if applying with family)
                        </label>

                        <div class="upload-box">

                            <input
                                type="file"
                                accept=".pdf"
                            >

                            <div class="upload-note">
                                PDF - Max 10MB
                            </div>

                        </div>

                    </div>



                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="submit-btn"
                    >

                        ✈ SUBMIT APPLICATION

                    </button>


                </div>

            </form>


        </div>

    </div>

</section>


</body>

</html>
